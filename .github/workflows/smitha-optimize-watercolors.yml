name: Optimize Smitha lifestyle illustrations
on:
  push:
    branches: [demo/smitha-rangaswamy-personal-2026]
    paths: ['.github/tmp-smitha-images/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Convert large watercolor originals to mobile-friendly WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          folder=Path('.github/tmp-smitha-images')
          destination=Path('smitha-personal/assets')
          destination.mkdir(parents=True,exist_ok=True)
          for stem in ['planning','family','care','career']:
              source=folder/('smitha-'+stem+'.png')
              if not source.exists():
                  raise SystemExit('Missing source illustration: '+str(source))
              with Image.open(source) as image:
                  im=ImageOps.exif_transpose(image).convert('RGB')
                  if im.width>640:
                      im.resize((640,round(im.height*640/im.width)),Image.Resampling.LANCZOS).save(destination/('smitha-'+stem+'.webp'),'WEBP',quality=48,method=6)
                  else:
                      im.save(destination/('smitha-'+stem+'.webp'),'WEBP',quality=48,method=6)
                  print(stem,(destination/('smitha-'+stem+'.webp')).stat().st_size,'bytes')
              source.unlink()
          PY
      - name: Commit optimized illustrations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/tmp-smitha-images smitha-personal/assets
          if ! git diff --cached --quiet; then
            git commit -m "Optimize lifestyle watercolors as lightweight mobile WebP images"
            git push
          fi
